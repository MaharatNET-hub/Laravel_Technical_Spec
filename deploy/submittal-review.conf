# Replace DOMAIN with the real sub-domain, e.g. review.example.com
server {
    listen 80;
    server_name DOMAIN;

    client_max_body_size 60m;          # submittal PDFs are ~20-50 MB

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;           # live progress while a review runs
        proxy_read_timeout 300s;
    }
}
