# Render blueprint: New → Blueprint → pick this repo (or New → Web Service, Language "Docker").
services:
  - type: web
    name: laravel-technical-spec
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: DEMO_LOCK_DISCLOSURE
        value: "false"
      # private direct-download link to the sample submittal; the seeder fetches it on every start
      - key: DEMO_SAMPLE_URL
        sync: false
